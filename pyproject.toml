[project]
name = "semora-console"
version = "0.1.0"
description = "Operator console showcasing semora's composable control plane — compose policy units across lifecycle hooks and watch the same task transform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "semora[fork,openrouter]>=0.2,<0.3",
  # Imported directly for the OpenRouter preset, so not left to a transitive edge.
  "semora-llm>=0.2,<0.3",
  "semora-store-pg>=0.2,<0.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"


[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
