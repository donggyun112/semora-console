<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexora · Control Plane Console</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/styles.css?v=16" />
  </head>
  <body>
    <div class="grid-noise"></div>

    <header>
      <div class="brand">
        <span class="mark">N</span>
        <b>NEXORA</b><span class="sep">/</span><span class="sub">CONTROL PLANE CONSOLE</span>
      </div>
      <div class="model" id="model">—</div>
    </header>

    <main>
      <!-- ── 01 THE TASK ─────────────────────────────────────────── -->
      <section class="col col-task">
        <h2 class="label"><span class="idx">01</span> 작업</h2>
        <div id="scenarios" class="scenarios"></div>
      </section>

      <!-- ── 02 THE CONTROL PLANE ───────────────────────────────── -->
      <section class="col col-policy">
        <h2 class="label"><span class="idx">02</span> 정책</h2>
        <div id="units" class="units"></div>
        <div class="compose">
          <div class="compose-label">조립</div>
          <code id="compose-summary">ControlPlane()  ·  컨트롤 없음</code>
        </div>
        <button id="run" class="run" disabled>실행</button>
      </section>

      <!-- ── 03 THE RUN ─────────────────────────────────────────── -->
      <section class="col col-run">
        <div class="run-head">
          <h2 class="label"><span class="idx">03</span> 실행</h2>
          <div class="run-actions">
            <button id="abort" class="abort hidden" type="button">중단</button>
            <span id="status" class="status idle">대기</span>
          </div>
        </div>
        <div id="policy-strip" class="policy-strip hidden"></div>
        <div id="stream" class="stream">
          <div class="empty">
            <div class="empty-mark">⌁</div>

          </div>
        </div>
        <div id="steer-box" class="steer-box hidden">
          <div class="steer-label">지시 큐</div>
          <div id="steer-queue" class="steer-queue"></div>
          <form id="steer-form" class="steer-form">
            <input id="steer-text" maxlength="200" placeholder="실행 중인 에이전트에 지시" autocomplete="off" />
            <button type="submit">보내기</button>
          </form>
        </div>
        <div id="recovery" class="recovery hidden">
          <div class="recovery-body">
            <span class="pulse crash"></span>
            <div>
              <strong>워커 장애</strong>
              <small><span id="recovery-meta"></span></small>
            </div>
          </div>
          <button id="recover" class="btn crash" type="button">복원</button>
        </div>
        <div id="approval" class="approval hidden">
          <div class="approval-body">
            <span class="pulse"></span>
            <div>
              <strong>일시중지 — 승인 대기</strong>
              <small><span id="approval-meta"></span></small>
            </div>
          </div>
          <div class="approval-actions">
            <button id="deny" class="btn ghost">거부</button>
            <button id="approve" class="btn primary">승인하고 재개</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js?v=16"></script>
  </body>
</html>
