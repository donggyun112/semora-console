# The durable proof needs a ledger that outlives the worker, which is what this file is
# for. Without DATABASE_URL the console keeps everything in memory and a restart loses
# the run — correctly, because the runtime loses it too.
#
#     docker compose up --build
#     open http://localhost:8850
#
# OPENROUTER_API_KEY comes from .env beside this file, the same one uv run uses.
name: semora-console

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console
      POSTGRES_DB: console
    volumes:
      # Named, so `docker compose restart console` and even `down` keep the ledger.
      # `down -v` is the one that throws the proof away.
      - console-ledger-v04:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 2s
      timeout: 3s
      retries: 30

  console:
    build: &console-build
      context: .
      dockerfile: Dockerfile
    environment: &console-env
      DATABASE_URL: postgresql://console:console@db:5432/console
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      MODEL: ${MODEL:-~deepseek/deepseek-v4-flash-latest}
      CONSOLE_WORKER: worker-a
      # Short enough that a paused worker loses its claim while somebody is watching.
      CONSOLE_LEASE_TTL: ${CONSOLE_LEASE_TTL:-60}
    ports:
      - "8850:8850"
    depends_on:
      db:
        condition: service_healthy

  # A second worker on the same ledger, off unless asked for:
  #     docker compose --profile two-workers up -d
  # Its own lease owner, because a worker that shares a name renews the other's lease
  # instead of contending with it.
  console-b:
    profiles: ["two-workers"]
    build: *console-build
    environment:
      <<: *console-env
      CONSOLE_WORKER: worker-b
    ports:
      - "8851:8850"
    depends_on:
      db:
        condition: service_healthy

volumes:
  console-ledger-v04:
